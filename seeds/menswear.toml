# Menswear + shoes niches for `ebay-tracker scan-niches`.
#
# Each [[seed]] is one niche: a sold search and an active search (pre-owned
# by default). `brand` lists the title spellings that count as a real comp.
# `alt_queries` are common misspellings: brand first, so the scan can match them.
# `keep` un-junks default junk terms (e.g. "women's" for unisex sizing).
# `filters.category` uses eBay category IDs: 93427 men's shoes, 15709 men's athletic
# shoes, 57988 men's coats & jackets, 57990 men's casual shirts, 11511 men's sweaters,
# 11483 men's jeans.

# Outbound label cost (USPS Ground Advantage, typical weights) by kind
[ship_cost]
boots = 14.0
shoes = 12.0
sneakers = 12.0
outerwear = 11.0
shirt = 6.0
knit = 8.0
denim = 7.0

